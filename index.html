<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spartiate Arènes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bronze: #d9a441;
    --bronze-2: #8a5a1c;
    --ink: #f5ead4;
    --muted: #b9a88a;
    --panel: rgba(18, 12, 8, 0.82);
    --line: rgba(217, 164, 65, 0.35);
    --p1: #ff5a4a;
    --p2: #4aa3ff;
    --hp: #e8c547;
    --hp-low: #e0452f;
    --guard: #6fc3ff;
    --stamina: #8fe36a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #120c08; color: var(--ink);
    font-family: 'Barlow Condensed', system-ui, sans-serif; user-select: none; }
  canvas { display: block; position: fixed; inset: 0; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- Loading ---------- */
  #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center;
    background: radial-gradient(circle at 50% 40%, #3a2412, #120c08 70%); z-index: 50; }
  #loading h1 { font-family: Cinzel, serif; font-weight: 900; letter-spacing: .12em; margin: 0; color: var(--bronze); }
  .pbar { width: min(320px, 70vw); height: 8px; border-radius: 4px; background: #2a1c10; overflow: hidden; margin: 0 auto; }
  #lp { height: 100%; width: 0; background: linear-gradient(90deg, var(--bronze-2), var(--bronze)); transition: width .2s; }
  #lerr { color: #ff9a8a; max-width: 520px; font-size: 18px; line-height: 1.35; }

  /* ---------- Menu ---------- */
  #menu { position: fixed; top: 0; left: 0; bottom: 0; width: min(420px, 100vw); overflow-y: auto;
    background: linear-gradient(90deg, rgba(14,9,5,.94), rgba(14,9,5,.82) 80%, rgba(14,9,5,0));
    padding: 28px 34px 28px 28px; z-index: 10; }
  #menu h1 { font-family: Cinzel, serif; font-weight: 900; font-size: 46px; letter-spacing: .08em; margin: 0;
    color: var(--bronze); text-shadow: 0 3px 0 #4a2c0c, 0 0 30px rgba(217,164,65,.35); line-height: 1; }
  #menu .sub { color: var(--muted); font-size: 19px; margin: 6px 0 18px; letter-spacing: .04em; }
  .sec { margin: 14px 0; }
  .sec > label { display: block; font-family: Cinzel, serif; font-weight: 800; font-size: 13px; letter-spacing: .18em;
    color: var(--bronze); margin-bottom: 7px; text-transform: uppercase; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { flex: 1 1 auto; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: rgba(255,255,255,.04); font-size: 18px; transition: background .15s, border-color .15s; }
  .seg button:hover { background: rgba(217,164,65,.12); }
  .seg button.on { background: linear-gradient(180deg, #d9a441, #a8701f); color: #1b0f05; border-color: #f1c66d; font-weight: 700; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card { text-align: left; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.04); position: relative; overflow: hidden; }
  .card .sw { height: 34px; border-radius: 6px; margin-bottom: 7px; }
  .card b { display: block; font-size: 18px; }
  .card span { color: var(--muted); font-size: 15px; line-height: 1.15; display: block; }
  .card.on { border-color: #f1c66d; box-shadow: 0 0 0 2px rgba(241,198,109,.5) inset; background: rgba(217,164,65,.14); }
  #go { margin-top: 18px; width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #f1c66d;
    background: linear-gradient(180deg, #e3b04f, #9b6418); color: #1b0f05; font-family: Cinzel, serif; font-weight: 900;
    font-size: 26px; letter-spacing: .12em; box-shadow: 0 6px 0 #4a2c0c, 0 10px 30px rgba(0,0,0,.4); }
  #go:hover { filter: brightness(1.08); }
  #go:active { transform: translateY(3px); box-shadow: 0 3px 0 #4a2c0c; }
  .keys { margin-top: 16px; font-size: 16px; color: var(--muted); line-height: 1.55; }
  .keys b { color: var(--ink); font-weight: 700; }
  kbd { display: inline-block; min-width: 22px; padding: 0 6px; border-radius: 5px; text-align: center; font-family: inherit; font-weight: 700;
    background: #f5ead4; color: #1b0f05; box-shadow: 0 2px 0 #8a7a5c; margin: 0 1px; font-size: 15px; line-height: 20px; }
  .netrow { display: flex; gap: 6px; margin-top: 6px; }
  .netrow input { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(0,0,0,.35);
    color: var(--ink); font: inherit; font-size: 20px; letter-spacing: .3em; text-transform: uppercase; text-align: center; }
  .netrow button { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.04); font-size: 18px; }
  .netrow button:hover { background: rgba(217,164,65,.12); }
  #netInfo { margin-top: 8px; font-size: 17px; color: var(--muted); line-height: 1.35; }
  #netInfo b { color: var(--ink); }
  #netInfo .code { font-family: Cinzel, serif; font-size: 30px; color: var(--bronze); letter-spacing: .15em; }
  #go:disabled { font-size: 18px; opacity: .55; cursor: default; filter: none; transform: none; }
  .small-btn { margin-top: 10px; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; color: var(--muted); font-size: 16px; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; top: 0; left: 0; right: 0; padding: 16px 22px; display: grid;
    grid-template-columns: 1fr auto 1fr; gap: 18px; align-items: start; z-index: 5; pointer-events: none; }
  .side .name { font-family: Cinzel, serif; font-weight: 800; font-size: 20px; letter-spacing: .06em; text-shadow: 0 2px 4px #000; }
  .p1 .name { color: #ffb3a8; } .p2 .name { color: #a8d4ff; text-align: right; }
  .bar { position: relative; height: 22px; border-radius: 4px; background: rgba(0,0,0,.55); border: 2px solid #f5ead4;
    box-shadow: 0 3px 10px rgba(0,0,0,.5); overflow: hidden; margin-top: 4px; }
  .bar .fill, .bar .trail { position: absolute; top: 0; bottom: 0; width: 100%; }
  .bar .trail { background: #fff; transition: width .5s ease .35s; }
  .bar .fill { background: linear-gradient(180deg, #ffe27a, var(--hp)); }
  .bar .fill.low { background: linear-gradient(180deg, #ff7a5a, var(--hp-low)); }
  .p1 .fill, .p1 .trail { right: 0; } .p2 .fill, .p2 .trail { left: 0; }
  .p1 .bar, .p1 .gbar { transform: scaleX(-1); }
  .gbar { height: 7px; margin-top: 4px; border-radius: 3px; background: rgba(0,0,0,.55); overflow: hidden; width: 70%; }
  .p2 .gbar { margin-left: auto; } .p1 .gbar { margin-left: auto; }
  .gfill { height: 100%; width: 100%; background: var(--guard); }
  .gfill.low { background: #ff9a3a; animation: blink .3s infinite alternate; }
  .sbar { height: 6px; margin-top: 3px; border-radius: 3px; background: rgba(0,0,0,.55); overflow: hidden; width: 55%; }
  .p1 .sbar { margin-left: auto; transform: scaleX(-1); } .p2 .sbar { margin-left: auto; }
  .sfill { height: 100%; width: 100%; background: var(--stamina); transition: width .08s linear; }
  .sfill.low { background: #e6c33a; }
  .sfill.fail { background: #ff4a3a; animation: blink .12s infinite alternate; }
  @keyframes blink { to { opacity: .35; } }
  .pips { display: flex; gap: 6px; margin-top: 6px; }
  .p2 .pips { justify-content: flex-end; }
  .pips i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #f5ead4; background: rgba(0,0,0,.4); }
  .pips i.on { background: radial-gradient(circle at 35% 35%, #fff3b0, var(--bronze)); box-shadow: 0 0 10px var(--bronze); }
  .center { text-align: center; }
  #timer { font-family: Cinzel, serif; font-weight: 900; font-size: 44px; line-height: 1; text-shadow: 0 3px 0 #000, 0 0 16px rgba(0,0,0,.6); }
  #timer.low { color: #ff7a5a; }
  #roundLbl { font-size: 16px; letter-spacing: .2em; color: var(--muted); text-shadow: 0 1px 3px #000; }

  #help { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 5; pointer-events: none;
    background: rgba(10,6,3,.62); border: 1px solid var(--line); border-radius: 10px; padding: 6px 14px; font-size: 16px;
    color: var(--muted); white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
  #help .row + .row { margin-top: 3px; }
  #help b { color: var(--ink); }

  /* ---------- Announcements ---------- */
  #announce { position: fixed; left: 0; right: 0; top: 38%; text-align: center; z-index: 8; pointer-events: none;
    font-family: Cinzel, serif; font-weight: 900; font-size: clamp(42px, 9vw, 110px); letter-spacing: .08em; color: #fff3d6;
    -webkit-text-stroke: 2px #4a2c0c; text-shadow: 0 6px 0 #4a2c0c, 0 0 40px rgba(255,180,60,.6); opacity: 0; }
  #announce.show { animation: ann 1.2s ease-out forwards; }
  #announce.ko { color: #ff6a50; text-shadow: 0 6px 0 #3a0c06, 0 0 50px rgba(255,60,30,.7); }
  @keyframes ann { 0% { opacity: 0; transform: scale(2.2); } 12% { opacity: 1; transform: scale(.95); } 20% { transform: scale(1); }
    80% { opacity: 1; } 100% { opacity: 0; transform: scale(1.05); } }
  #pops { position: fixed; inset: 0; pointer-events: none; z-index: 7; }
  .pop { position: absolute; transform: translate(-50%, -50%); font-family: Cinzel, serif; font-weight: 900; font-size: 26px;
    color: #fff; -webkit-text-stroke: 1px #000; text-shadow: 0 3px 0 #000; animation: pop 1s ease-out forwards; white-space: nowrap; }
  .pop.dmg { font-family: 'Barlow Condensed'; font-size: 30px; color: #ffe27a; }
  .pop.parry { color: #8fd8ff; font-size: 32px; }
  .pop.brk { color: #ffb04a; font-size: 32px; }
  .pop.miss { color: #d8d8d8; font-size: 22px; }
  @keyframes pop { 0% { opacity: 0; margin-top: 10px; transform: translate(-50%,-50%) scale(.6); }
    15% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); } 30% { transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; margin-top: -60px; } }

  #fade, #flash { position: fixed; inset: 0; pointer-events: none; z-index: 9; opacity: 0; }
  #fade { background: #0a0604; transition: opacity .3s; }
  #fade.on { opacity: 1; }
  #flash { background: #dfe8ff; }

  /* ---------- Overlays ---------- */
  .overlay { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; z-index: 20;
    background: radial-gradient(circle, rgba(20,12,6,.7), rgba(10,6,3,.92)); padding: 16px; }
  .overlay h2 { font-family: Cinzel, serif; font-weight: 900; font-size: clamp(40px, 8vw, 84px); margin: 0; color: var(--bronze);
    letter-spacing: .06em; text-shadow: 0 5px 0 #4a2c0c; }
  .overlay p { font-size: 24px; color: var(--muted); margin: 8px 0 22px; }
  .overlay .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .overlay .btns button { padding: 12px 26px; border-radius: 10px; border: 2px solid var(--line); background: rgba(255,255,255,.06);
    font-family: Cinzel, serif; font-weight: 800; font-size: 20px; letter-spacing: .06em; }
  .overlay .btns button.main { border-color: #f1c66d; background: linear-gradient(180deg, #e3b04f, #9b6418); color: #1b0f05; }

  /* ---------- Configuration des touches ---------- */
  #keysOv { z-index: 30; }
  .kpanel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px;
    max-width: calc(100vw - 32px); max-height: calc(100vh - 32px); overflow: auto; }
  .kpanel h3 { font-family: Cinzel, serif; font-weight: 900; font-size: 30px; letter-spacing: .1em; color: var(--bronze); margin: 0 0 6px; }
  #kHint { font-size: 17px; color: var(--muted); margin: 0 0 4px; min-height: 26px; }
  #kHint b { color: var(--ink); }
  #kNote { font-size: 15px; color: var(--muted); margin: 0 0 10px; font-style: italic; }
  #kTable { border-collapse: collapse; margin: 0 auto 14px; font-size: 17px; }
  #kTable th { font-family: Cinzel, serif; font-size: 14px; letter-spacing: .12em; padding: 4px 6px; }
  #kTable th.kp1 { color: #ffb3a8; } #kTable th.kp2 { color: #a8d4ff; }
  #kTable td { padding: 2px 3px; }
  #kTable td.kact { text-align: right; padding-right: 12px; color: var(--ink); white-space: nowrap; }
  .kslot { min-width: 92px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: rgba(255,255,255,.05);
    font-weight: 700; font-size: 16px; }
  .kslot:hover { background: rgba(217,164,65,.15); }
  .kslot.empty { color: var(--muted); font-weight: 500; }
  .kslot.wait { border-color: #f1c66d; background: rgba(217,164,65,.3); animation: blink .4s infinite alternate; }
  .kpanel .btns { display: flex; gap: 12px; justify-content: center; }
  .kpanel .btns button { padding: 10px 22px; font-size: 18px; }

  @media (max-width: 720px) {
    #menu { padding: 18px 16px; background: rgba(14,9,5,.9); }
    #menu h1 { font-size: 36px; }
    .side .name { font-size: 15px; }
    #timer { font-size: 32px; }
    #hud { padding: 10px 16px; gap: 10px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>

<div id="loading">
  <h1>SPARTIATE</h1>
  <div>Préparation des arènes…</div>
  <div class="pbar"><div id="lp"></div></div>
  <div id="lerr" class="hidden"></div>
</div>

<div id="menu" class="hidden">
  <h1>SPARTIATE</h1>
  <div class="sub">Les arènes des petits gladiateurs</div>

  <div class="sec"><label>Mode</label>
    <div class="seg" data-key="mode">
      <button data-val="solo">1 joueur contre l'IA</button>
      <button data-val="duo">2 joueurs</button>
      <button data-val="online">En ligne (réseau local)</button>
    </div>
  </div>
  <div class="sec" id="diffSec"><label>Difficulté de l'IA</label>
    <div class="seg" data-key="diff">
      <button data-val="0">Facile</button>
      <button data-val="1">Normal</button>
      <button data-val="2">Difficile</button>
    </div>
  </div>
  <div class="sec hidden" id="netSec"><label>Partie en ligne</label>
    <div class="netrow"><button id="hostBtn" style="flex:1">Créer une partie</button></div>
    <div class="netrow"><input id="codeIn" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false"><button id="joinBtn">Rejoindre</button></div>
    <div id="netInfo">Crée une partie et donne le code à ton ami, ou entre le code qu'il t'a donné.</div>
  </div>
  <div class="sec"><label id="p1Lbl">Joueur 1</label>
    <div class="seg" data-key="p1">
      <button data-val="soldier">Gladiateur</button>
      <button data-val="human">Mirmillon</button>
      <button data-val="orc">Orc</button>
    </div>
  </div>
  <div class="sec" id="p2Sec"><label id="p2Lbl">Adversaire</label>
    <div class="seg" data-key="p2">
      <button data-val="soldier">Gladiateur</button>
      <button data-val="human">Mirmillon</button>
      <button data-val="orc">Orc</button>
    </div>
  </div>
  <div class="sec" id="arenaSec"><label>Arène</label>
    <div class="cards" id="arenaCards"></div>
  </div>

  <button id="go">COMBATTRE</button>

  <div class="keys" id="keysMenu"></div>
  <button class="small-btn" id="keysBtn">Configurer les touches</button>
  <button class="small-btn" id="soundBtn">Son : activé</button>
</div>

<div id="hud" class="hidden">
  <div class="side p1">
    <div class="name" id="n1">Joueur 1</div>
    <div class="bar"><div class="trail" id="t1"></div><div class="fill" id="h1"></div></div>
    <div class="gbar"><div class="gfill" id="g1"></div></div>
    <div class="sbar"><div class="sfill" id="s1"></div></div>
    <div class="pips" id="w1"><i></i><i></i></div>
  </div>
  <div class="center">
    <div id="timer">60</div>
    <div id="roundLbl">ROUND 1</div>
  </div>
  <div class="side p2">
    <div class="name" id="n2">Joueur 2</div>
    <div class="bar"><div class="trail" id="t2"></div><div class="fill" id="h2"></div></div>
    <div class="gbar"><div class="gfill" id="g2"></div></div>
    <div class="sbar"><div class="sfill" id="s2"></div></div>
    <div class="pips" id="w2"><i></i><i></i></div>
  </div>
</div>

<div id="help" class="hidden"></div>
<div id="announce"></div>
<div id="pops"></div>
<div id="flash"></div>
<div id="fade"></div>

<div id="pause" class="overlay hidden">
  <h2>PAUSE</h2>
  <p id="pauseTxt">Échap pour reprendre</p>
  <div class="btns">
    <button class="main" id="resumeBtn">Reprendre</button>
    <button id="pauseKeysBtn">Touches</button>
    <button id="quitBtn">Menu principal</button>
  </div>
</div>

<div id="result" class="overlay hidden">
  <h2 id="resTitle">VICTOIRE</h2>
  <p id="resSub">2 – 1</p>
  <div class="btns">
    <button class="main" id="againBtn">Revanche</button>
    <button id="menuBtn">Menu principal</button>
  </div>
</div>

<div id="keysOv" class="overlay hidden">
  <div class="kpanel">
    <h3>TOUCHES</h3>
    <div id="kHint"></div>
    <div id="kNote"></div>
    <table id="kTable"></table>
    <div class="btns">
      <button id="kReset">Par défaut</button>
      <button class="main" id="kDone">Terminé</button>
    </div>
  </div>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
